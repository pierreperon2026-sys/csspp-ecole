<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0758b8"><link rel="manifest" href="manifest.webmanifest"><title>C.S.S.P.P</title>
<style>
:root{--b:#0758b8;--r:#e5242a;--g:#24a148;--y:#f6c515;--ink:#12233f;--muted:#6b788b;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}.app{max-width:1100px;margin:auto;background:#fff;min-height:100vh}.hero{position:relative;min-height:430px;overflow:hidden;color:#fff;background:#062c64}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(#001b44aa,#001b4430 45%,#001b44d9),url("building.jpg") center/cover}.top,.brand{position:relative}.top{display:flex;justify-content:space-between;padding:20px}.ib{width:50px;height:50px;border:0;border-radius:15px;background:#fff;color:var(--b);font-size:24px}.brand{text-align:center;padding:0 16px 30px}.logo{width:140px;height:140px;object-fit:cover;border-radius:50%;border:5px solid #fff}.brand h1{font-size:56px;letter-spacing:8px;margin:12px 0 0}.brand p{font-weight:700;font-size:18px}.slogan{color:#ffe16a}.content{padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:-48px;position:relative}.tile{border:0;background:#fff;border-radius:19px;padding:16px 8px;min-height:130px;box-shadow:0 8px 25px #17345c1a;font-weight:800;color:var(--ink)}.ico{width:56px;height:56px;margin:auto;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:26px}.blue{background:var(--b)}.red{background:var(--r)}.green{background:var(--g)}.yellow{background:var(--y)}.purple{background:#6d32c9}.tile small{display:block;color:var(--muted);font-weight:500;margin-top:5px}.page{display:none}.page.active{display:block}.section{margin-top:28px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:17px;border-radius:18px;background:#f2f6ff}.card.urgent{background:#fff0f0}.card.event{background:#eff9f0}.tag{display:inline-block;padding:5px 8px;border-radius:7px;background:var(--b);color:#fff;font-size:11px;font-weight:800}.urgent .tag{background:var(--r)}.event .tag{background:var(--g)}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#fff;border:1px solid #e0e7f0;border-radius:13px;padding:12px;margin:8px 0}.form{max-width:700px}.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid #d7e0ea;border-radius:11px;margin:6px 0 12px}.primary,.form button{background:var(--b);color:#fff;border:0;border-radius:11px;padding:12px 16px;font-weight:800}.danger{background:var(--r);color:#fff;border:0;border-radius:9px;padding:8px}.bottom{position:sticky;bottom:0;display:flex;justify-content:space-around;background:#fffffff2;backdrop-filter:blur(12px);border-top:1px solid #e2e7ef;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:5}.nav{background:none;border:0;color:#667386;font-size:11px}.nav.active{color:var(--b);font-weight:800}.nav span{display:block;font-size:20px;margin-bottom:2px}.modal{display:none;position:fixed;inset:0;background:#001a4477;z-index:20;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:min(720px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:22px}.close{float:right;border:0;background:#eef2f7;border-radius:50%;width:36px;height:36px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(#062b60cc,#062b60cc),url("building.jpg") center/cover}.loginbox{width:min(440px,100%);background:#fff;border-radius:24px;padding:25px;box-shadow:0 15px 50px #0005}.loginbox img{display:block;width:100px;height:100px;object-fit:cover;border-radius:50%;margin:auto}.muted{color:var(--muted)}.hidden{display:none!important}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.brand h1{font-size:42px;letter-spacing:5px}}
</style></head><body><div id="root"></div>
<script>
const root=document.createElement("div");root.id="root";document.body.appendChild(root);const API="/api";let token=localStorage.csspp_token||"",me=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};if(opt.body&&typeof opt.body!=="string"){opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(opt.body)}const r=await fetch(API+url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Erreur");return d}
function login(){root.innerHTML=`<div class=login><form class=loginbox id=lf><img src=logo.jpg><h2>Connexion C.S.S.P.P</h2><p class=muted>Complexe Scolaire Saint Pierre Peron</p><input name=email type=email placeholder="E-mail" required><input name=password type=password placeholder="Mot de passe" required><button class=primary>Se connecter</button><p id=le class=muted></p></form></div>`;lf.onsubmit=async e=>{e.preventDefault();le.textContent="Connexion...";try{let d=await api("/auth/login",{method:"POST",body:Object.fromEntries(new FormData(lf))});token=d.token;localStorage.csspp_token=token;me=d.user;boot()}catch(x){le.textContent=x.message}}}
async function boot(){try{me=await api("/me")}catch(e){token="";localStorage.removeItem("csspp_token");return login()}render()}
function render(){root.innerHTML=`<div class=app><header class=hero><div class=top><button class=ib>☰</button><button class=ib onclick=notify()>🔔</button></div><div class=brand><img class=logo src=logo.jpg><h1>C.S.S.P.P</h1><p>Complexe Scolaire Saint Pierre Peron</p><p class=slogan>Discipline • Travail • Succès</p></div></header><main class=content><section class=grid>
${tile("accueil","⌂","ACCUEIL","Tableau de bord","blue")}${tile("annonces","📣","ANNONCES","Informations","red")}${tile("devoirs","📖","DEVOIRS","Professeurs","green")}${tile("evenements","📅","ÉVÉNEMENTS","Calendrier","yellow")}${tile("propositions","💡","PROPOSITIONS","Vos idées","purple")}${tile("urgence","!","URGENCE","Alertes","red")}${tile("ecole","i","ÉCOLE","Informations","blue")}${tile("profil","👤","PROFIL",esc(me.name),"blue")}</section>
<section id=accueil class="page active"><h2>Informations importantes</h2><div id=posts class=cards></div></section>
<section id=annonces class=page><h2>Annonces</h2>${canPost()?postForm():""}<div id=posts2></div></section>
<section id=devoirs class=page><h2>Devoirs</h2>${canPost()?homeworkForm():""}<div id=hw></div></section>
<section id=evenements class=page><h2>Événements</h2>${canPost()?eventForm():""}<div id=ev></div></section>
<section id=propositions class=page><h2>Propositions des élèves</h2><form class=form id=sf><textarea name=body rows=5 placeholder="Votre proposition..." required></textarea><label><input type=checkbox name=anonymous> Envoyer anonymement</label><br><button class=primary>Envoyer</button></form><div id=sg></div></section>
<section id=urgence class=page><h2>🚨 Urgence</h2><div class="card urgent"><h3>Canal d'urgence</h3><p>Les alertes publiées par l'administration apparaissent dans les annonces et peuvent être envoyées en notification.</p></div></section>
<section id=ecole class=page><h2>Informations de l'école</h2><div class=card><h3>Complexe Scolaire Saint Pierre Peron</h3><p>Enseignements général et technique.</p><p>Système franco-congolais.</p><p>Discipline • Travail • Succès</p></div></section>
<section id=profil class=page><h2>Mon profil</h2><div class=card><b>${esc(me.name)}</b><p>${esc(me.email)}</p><p>Rôle : ${esc(me.role)}</p><p>Classe : ${esc(me.class_name||"—")}</p><button class=danger onclick=logout>Se déconnecter</button></div>${me.role==="admin"?adminPanel():""}</section>
</main><nav class=bottom>${nav("accueil","⌂","Accueil")}${nav("devoirs","📖","Devoirs")}${nav("annonces","📣","Annonces")}${nav("evenements","📅","Événements")}${nav("profil","👤","Profil")}</nav></div><div id=modal class=modal><div class=sheet><button class=close onclick=closeModal>×</button><div id=mb></div></div></div>`;
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>show(b.dataset.page));loadAll();document.getElementById("sf").onsubmit=submitSuggestion;
if(canPost()){$("#pf").onsubmit=submitPost;$("#hf").onsubmit=submitHw;$("#ef").onsubmit=submitEvent}
}
function tile(id,ico,t,sub,c){return `<button class=tile onclick="show('${id}')"><div class="ico ${c}">${ico}</div>${t}<small>${sub}</small></button>`}
function nav(id,ico,t){return `<button class=nav data-page=${id}><span>${ico}</span>${t}</button>`}
function canPost(){return ["admin","teacher"].includes(me.role)}
function postForm(){return `<form id=pf class=form><select name=type><option value=announcement>Annonce</option><option value=urgent>Urgence</option><option value=event>Événement</option></select><input name=title placeholder="Titre" required><textarea name=body placeholder="Message" required></textarea><input name=dateText placeholder="Date"><input name=place placeholder="Lieu"><button>Publier</button></form>`}
function homeworkForm(){return `<form id=hf class=form><input name=subject placeholder="Matière" required><input name=className placeholder="Classe (ex. 6e)" required><input name=title placeholder="Titre du devoir" required><textarea name=body placeholder="Consignes"></textarea><input name=deadline type=date required><button>Publier le devoir</button></form>`}
function eventForm(){return `<form id=ef class=form><input name=title placeholder="Événement" required><input name=dateText type=date required><input name=place placeholder="Lieu"><textarea name=body placeholder="Description"></textarea><button>Ajouter</button></form>`}
function adminPanel(){return `<hr><h3>Administration</h3><button class=primary onclick=users()>Gérer les utilisateurs</button>`}
function show(id){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.page===id));scrollTo({top:0,behavior:"smooth"})}
async function loadAll(){let [p,h,e]=await Promise.all([api("/posts"),api("/homework"),api("/events")]);$("#posts").innerHTML=cards(p);$("#posts2").innerHTML=cards(p);$("#hw").innerHTML=h.map(x=>row(`${esc(x.subject)} — ${esc(x.title)}`,`${esc(x.class_name)} · ${esc(x.deadline)}`,canPost()?`<button onclick="del('/homework/${x.id}')">×</button>`:"")).join("")||"<p class=muted>Aucun devoir.</p>";$("#ev").innerHTML=e.map(x=>row(esc(x.title),`${esc(x.date_text)} · ${esc(x.place)}`,canPost()?`<button onclick="del('/events/${x.id}')">×</button>`:"")).join("")||"<p class=muted>Aucun événement.</p>";}
function cards(p){return `<div class=cards>${p.map(x=>`<article class="card ${x.type}"><span class=tag>${x.type==="urgent"?"URGENT":x.type==="event"?"ÉVÉNEMENT":"ANNONCE"}</span><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p><small>${esc(x.date_text||"")} ${x.place?"· "+esc(x.place):""}</small>${me.role==="admin"?`<br><button onclick="del('/posts/${x.id}')">Supprimer</button>`:""}</article>`).join("")}</div>`}
function row(a,b,c){return `<div class=row><b>${a}</b><span>${b}</span>${c}</div>`}
async function submitPost(e){e.preventDefault();try{await api("/posts",{method:"POST",body:Object.fromEntries(new FormData(e.target))});e.target.reset();await loadAll();alert("Publication envoyée.")}catch(x){alert(x.message)}}
async function submitHw(e){e.preventDefault();try{await api("/homework",{method:"POST",body:Object.fromEntries(new FormData(e.target))});e.target.reset();await loadAll();alert("Devoir publié.")}catch(x){alert(x.message)}}
async function submitEvent(e){e.preventDefault();try{await api("/events",{method:"POST",body:Object.fromEntries(new FormData(e.target))});e.target.reset();await loadAll();alert("Événement ajouté.")}catch(x){alert(x.message)}}
async function submitSuggestion(e){e.preventDefault();let f=new FormData(e.target);try{await api("/suggestions",{method:"POST",body:{body:f.get("body"),anonymous:f.has("anonymous")}});e.target.reset();alert("Proposition envoyée.");}catch(x){alert(x.message)}}
async function del(url){if(!confirm("Supprimer ?"))return;try{await api(url,{method:"DELETE"});loadAll()}catch(x){alert(x.message)}}
function modal(html){mb.innerHTML=html;modalEl.classList.add("open")}const modalEl=document.createElement("div");
function notify(){modal(`<h2>🔔 Notifications</h2><p>Les notifications push sont disponibles lorsque les clés VAPID sont configurées sur le serveur.</p>`)}
function closeModal(){modalEl.classList.remove("open")}
async function users(){let u=await api("/admin/users");modal(`<h2>Utilisateurs</h2>${u.map(x=>`<div class=row><span><b>${esc(x.name)}</b><br>${esc(x.email)} · ${esc(x.role)}</span>${x.id!==me.id?`<button class=danger onclick="delUser(${x.id})">×</button>`:""}</div>`).join("")}<h3>Créer un compte</h3><form id=uf class=form><input name=name placeholder="Nom" required><input name=email type=email placeholder="E-mail" required><input name=password type=password placeholder="Mot de passe" required><select name=role><option>teacher</option><option>student</option><option>parent</option><option>admin</option></select><input name=className placeholder="Classe"><button>Créer</button></form>`);uf.onsubmit=async e=>{e.preventDefault();try{await api("/admin/users",{method:"POST",body:Object.fromEntries(new FormData(uf))});users()}catch(x){alert(x.message)}}}
async function delUser(id){await api("/admin/users/"+id,{method:"DELETE"});users()}
function logout(){localStorage.removeItem("csspp_token");location.reload()}
document.addEventListener("DOMContentLoaded",async()=>{if(!token)return login();try{me=await api("/me");render()}catch(e){login()}})
function login(){document.body.innerHTML=`<div class=login><form class=loginbox id=lf><img src=logo.jpg><h2>Connexion C.S.S.P.P</h2><p>Complexe Scolaire Saint Pierre Peron</p><input name=email type=email placeholder="E-mail" required><input name=password type=password placeholder="Mot de passe" required><button class=primary>Se connecter</button><p id=err class=muted></p></form></div>`;lf.onsubmit=async e=>{e.preventDefault();try{let d=await api("/auth/login",{method:"POST",body:Object.fromEntries(new FormData(lf))});token=d.token;localStorage.csspp_token=token;me=d.user;location.reload()}catch(x){err.textContent=x.message}}}
if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");
</script></body></html>
