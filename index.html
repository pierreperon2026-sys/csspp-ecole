<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b63ce"><title>C.S.S.P.P — Complexe Scolaire Saint Pierre Peron</title><link rel="manifest" href="/manifest.webmanifest"><style>body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;margin:0;background:#f5f7fb;color:#152033}header{background:#0b63ce;color:#fff;padding:18px}main{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0001}input,textarea,select,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:10px;border:1px solid #ccd3df}button{background:#0b63ce;color:#fff;border:0;font-weight:700}.danger{background:#c62828}.muted{color:#667085}.hidden{display:none}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tabs button{font-size:12px}.item{border-top:1px solid #eee;padding:12px 0}</style></head><body><header><strong>🏫 C.S.S.P.P</strong><div>Complexe Scolaire Saint Pierre Peron</div></header><main><section id="login" class="card"><h2>Connexion</h2><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Mot de passe"><button onclick="login()">Se connecter</button><p id="err" class="muted"></p></section><section id="app" class="hidden"><div class="card"><h2 id="welcome"></h2><button onclick="logout()">Se déconnecter</button></div><div class="tabs"><button onclick="load('announcements')">📢 Annonces</button><button onclick="load('homework')">📚 Devoirs</button><button onclick="load('events')">📅 Événements</button><button onclick="showSuggestion()">💡 Proposer</button></div><div id="content" class="card"></div></section></main><script>let token='',me=null;const $=id=>document.getElementById(id);async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');return d}async function login(){try{const d=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})}).then(r=>r.json());if(!d.token)throw Error(d.error);token=d.token;me=d.user;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='Bonjour '+me.name;load('announcements')}catch(e){$('err').textContent=e.message}}async function load(type){const d=await api('/api/'+type);$('content').innerHTML='<h2>'+({announcements:'📢 Annonces',homework:'📚 Devoirs',events:'📅 Événements'}[type])+'</h2>'+d.map(x=>`<div class=item><b>${esc(x.title)}</b><div>${esc(x.body||x.description||'')}</div><small class=muted>${esc(x.author_name||'C.S.S.P.P')}</small></div>`).join('')||'<p>Aucun élément.</p>'}function showSuggestion(){$('content').innerHTML='<h2>💡 Proposition</h2><textarea id="suggest" rows="6" placeholder="Votre proposition..."></textarea><label><input id="anon" type="checkbox" style="width:auto"> Envoyer anonymement</label><button onclick="sendSuggestion()">Envoyer</button>'}async function sendSuggestion(){await api('/api/suggestions',{method:'POST',body:JSON.stringify({body:$('suggest').value,anonymous:$('anon').checked})});$('content').innerHTML='<h2>Merci !</h2><p>Votre proposition a été transmise à l’administration.</p>'}function logout(){token='';me=null;$('app').classList.add('hidden');$('login').classList.remove('hidden')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
